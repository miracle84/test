<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  #board { display: grid; gap: 2px; margin-top: 20px; }
  .cell {
    width: 50px; height: 50px; background: #f0f0f0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; cursor: pointer;
  }
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<div id="setup">
  <label>Board size:
    <input type="number" id="size" value="3" min="3" max="10">
  </label>
  <label>Win length:
    <input type="number" id="win-length" value="3" min="3" max="10">
  </label>
  <label>
    <select id="mode">
      <option value="human">Two Players</option>
      <option value="cpu">Play vs Computer</option>
    </select>
  </label>
  <button id="start">Start Game</button>
</div>
<div id="status"></div>
<div id="board"></div>
<script src="game.js"></script>
</body>
</html>
